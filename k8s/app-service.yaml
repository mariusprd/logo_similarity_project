apiVersion: v1
kind: Service
metadata:
  name: fastapi-app-service
spec:
  type: NodePort # Exposes the service on each Node's IP at a static port.
  selector:
    app: fastapi-app
  ports:
    - protocol: TCP
      port: 8000 # Port inside the cluster
      targetPort: 8000 # Port on the pod
      nodePort: 30007 # Port to access from outside